<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>События</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html">Главная</a>
    <a href="create-event.html">Создать событие</a>
</div>

<div class="container">

    <h1>События</h1>

    <button onclick="loadEvents()">
        Загрузить события
    </button>

    <div id="events" class="grid"></div>

</div>

<script src="js/app.js"></script>

<script>

    async function loadEvents() {

        const events = await getPublishedEvents();

        const container =
            document.getElementById("events");

        container.innerHTML = "";

        events.forEach(event => {

            container.innerHTML += `

            <div class="event-card">

                <h2>${event.title}</h2>

                <p>${event.annotation}</p>

                <p>
                    <strong>ID:</strong>
                    ${event.id}
                </p>

                <p>
                    <strong>Дата:</strong>
                    ${event.eventDate}
                </p>

                <p>
                    <strong>Категория:</strong>
                    ${event.category?.name || "-"}
                </p>

                <p>
                    <strong>Просмотры:</strong>
                    ${event.views}
                </p>

                <p>
                    <strong>Подтверждено:</strong>
                    ${event.confirmedRequests}
                </p>

                <button onclick="openEvent(${event.id})">
                    Открыть
                </button>

                <button onclick="requestParticipation(${event.id})">
                    Подать заявку
                </button>

            </div>
        `;
        });
    }

    function openEvent(id) {

        location.href =
            `event.html?id=${id}`;
    }

    async function requestParticipation(id) {

        try {

            await createParticipationRequest(id);

            alert("Заявка отправлена");

        } catch (e) {

            alert("Ошибка");
        }
    }

    loadEvents();

</script>

</body>
</html>
