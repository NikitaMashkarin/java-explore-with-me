<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Комментарии</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html">Главная</a>
</div>

<div class="container">

    <h1>Комментарии</h1>

    <div class="card">

        <h2>Создать комментарий</h2>

        <input type="number"
               id="commentEventId"
               placeholder="ID события">

        <textarea id="commentText"
                  placeholder="Текст комментария"></textarea>

        <button onclick="createComment()">
            Создать комментарий
        </button>

        <div id="createCommentResult"></div>

    </div>

    <div class="card">

        <h2>Получить комментарии события</h2>

        <input type="number"
               id="commentsEventId"
               placeholder="ID события">

        <button onclick="getCommentsByEventId()">
            Загрузить комментарии
        </button>

        <div id="commentsContainer"
             class="grid"></div>

    </div>

    <div class="card">

        <h2>Получить комментарий по ID</h2>

        <input type="number"
               id="getCommentId"
               placeholder="ID комментария">

        <button onclick="getCommentById()">
            Получить комментарий
        </button>

        <div id="singleComment"></div>

    </div>

    <div class="card">

        <h2>Обновить комментарий</h2>

        <input type="number"
               id="updateCommentId"
               placeholder="ID комментария">

        <textarea id="updateCommentText"
                  placeholder="Новый текст"></textarea>

        <button onclick="updateComment()">
            Обновить комментарий
        </button>

        <div id="updateCommentResult"></div>

    </div>

    <div class="card">

        <h2>Удалить комментарий</h2>

        <input type="number"
               id="deleteCommentId"
               placeholder="ID комментария">

        <button onclick="deleteComment()">
            Удалить комментарий
        </button>

        <div id="deleteCommentResult"></div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
