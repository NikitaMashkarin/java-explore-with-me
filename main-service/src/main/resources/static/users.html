<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Пользователи</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html">Главная</a>
</div>

<div class="container">

    <h1>Пользователи</h1>

    <button onclick="loadUsers()">
        Загрузить пользователей
    </button>

    <div id="users" class="grid"></div>

</div>

<script src="js/app.js"></script>

<script>

    async function loadUsers() {

        const users =
            await getUsers();

        const container =
            document.getElementById("users");

        container.innerHTML = "";

        users.forEach(user => {

            container.innerHTML += `

            <div class="event-card">

                <h3>${user.name}</h3>

                <p>${user.email}</p>

                <p>ID: ${user.id}</p>

                <button onclick="removeUser(${user.id})">
                    Удалить
                </button>

            </div>
        `;
        });
    }

    async function removeUser(id) {

        await deleteUser(id);

        loadUsers();
    }

    loadUsers();

</script>

</body>
</html>
