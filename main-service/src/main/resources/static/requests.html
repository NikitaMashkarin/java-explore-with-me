<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">

    <title>Заявки</title>

    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="navbar">
    <a href="index.html">Главная</a>
</div>

<div class="container">

    <h1>Мои заявки</h1>

    <div id="requests" class="grid"></div>

</div>

<script src="js/app.js"></script>

<script>

    async function loadRequests() {

        const requests =
            await getParticipationRequests();

        const container =
            document.getElementById("requests");

        container.innerHTML = "";

        requests.forEach(request => {

            container.innerHTML += `

            <div class="event-card">

                <p>
                    <strong>ID:</strong>
                    ${request.id}
                </p>

                <p>
                    <strong>Event:</strong>
                    ${request.event}
                </p>

                <p>
                    <strong>Status:</strong>
                    ${request.status}
                </p>

                <button onclick="cancelRequest(${request.id})">
                    Отменить
                </button>

            </div>
        `;
        });
    }

    async function cancelRequest(id) {

        await cancelParticipationRequest(id);

        loadRequests();
    }

    loadRequests();

</script>

</body>
</html>
